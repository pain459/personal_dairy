version: '3.8'

services:
  diary:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - diary_data:/app/data
    environment:
      - PORT=8888
      - DATABASE_URL=sqlite:///./data/diary.db
    restart: unless-stopped

volumes:
  diary_data: